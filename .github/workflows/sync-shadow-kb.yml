name: Sync Shadow KB

on:
  push:
    branches:
      - main
    paths:
      - "Portfolio_KB/**"

jobs:
  sync-kb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Dify Knowledge Base
        env:
          DIFY_API_BASE_URL: ${{ secrets.DIFY_API_BASE_URL }}
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_DATASET_ID: ${{ secrets.DIFY_DATASET_ID }}
          DIFY_DATASET_NAME: ${{ secrets.DIFY_DATASET_NAME }}
          DIFY_INDEXING_TECHNIQUE: ${{ secrets.DIFY_INDEXING_TECHNIQUE }}
        run: node -r ts-node/register scripts/kb-sync/run-sync.ts
